<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>АЮ READY КВИЗ — ответы</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: one column, sticky header with two big mode buttons; round chips 1–7 over a 7-line answer sheet */
:root{
  --bg:#f3f2f8; --surface:#ffffff; --ink:#1c1a2e; --muted:#6c6887; --line:#dcd9e8;
  --accent:#ffcf33; --accent-ink:#1c1a2e; --brand:#3b2fb8; --ok:#1f8a55; --warn:#b4541a; --danger:#c0303a;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121c; --surface:#1d1b2b; --ink:#eeecf7; --muted:#9d99b8; --line:#322f47;
  --accent:#ffd54d; --accent-ink:#1c1a2e; --brand:#9d94ff; --ok:#4cc98a; --warn:#f0a060; --danger:#ff6b74; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121c; --surface:#1d1b2b; --ink:#eeecf7; --muted:#9d99b8; --line:#322f47;
  --accent:#ffd54d; --accent-ink:#1c1a2e; --brand:#9d94ff; --ok:#4cc98a; --warn:#f0a060; --danger:#ff6b74; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:16px 12px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(18px,4.5vw,24px);margin:0;letter-spacing:.01em}
h1 span{background:var(--accent);color:var(--accent-ink);padding:0 .3em;border-radius:4px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.saved .dot{background:var(--ok)} .status.saving .dot{background:var(--accent)} .status.error .dot{background:var(--danger)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.mode{font-family:var(--display);font-weight:600;font-size:15px;padding:14px 10px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.mode[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
:root[data-theme="dark"] .mode[aria-pressed="true"]{color:#13121c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mode[aria-pressed="true"]{color:#13121c}}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rounds{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.chip{min-width:52px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink)}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:16px 0 10px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr;align-items:center;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.num{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center;font-size:14px}
.row input{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:500 17px var(--body);padding:14px 12px 14px 0}
.row input::placeholder{color:var(--muted);opacity:.6}
.all{margin-top:28px}
.all table{width:100%;border-collapse:collapse;font-size:14px}
.all th{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px}
.all td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top}
.all td:first-child{color:var(--muted);font-variant-numeric:tabular-nums;width:48px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.summary{display:flex;gap:24px;flex-wrap:wrap;margin:18px 0 12px;color:var(--muted);font-size:14px}
.summary b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);font-variant-numeric:tabular-nums}
.team{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;grid-template-areas:"idx name step del";gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.team .idx{grid-area:idx}.team .name{grid-area:name}.team .stepper{grid-area:step}.team .del{grid-area:del}
.team:first-child{border-top:0}
.team .idx{color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-size:14px}
.team .name{min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:500 17px var(--body);line-height:1.3;padding:8px 0;resize:none;overflow:hidden;display:block;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{width:34px;height:36px;border:0;background:var(--bg);color:var(--ink);font-size:18px;cursor:pointer}
.stepper input{width:40px;border:0;text-align:center;background:var(--surface);color:var(--ink);font:600 16px var(--body);font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.del{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:8px 6px}
.del.confirm{color:var(--danger);font-weight:600}
.add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add input{flex:1 1 200px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 16px var(--body)}
.btn{padding:12px 18px;border-radius:10px;border:0;background:var(--brand);color:#fff;font:600 15px var(--body);cursor:pointer}
:root[data-theme="dark"] .btn{color:#13121c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#13121c}}
.empty{padding:22px;text-align:center;color:var(--muted)}
.backup{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.ghost{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 14px var(--body);cursor:pointer}
.note{font-size:13px;color:var(--muted);margin-top:18px}
@media (max-width:640px){.team{grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"idx name name" ". step del";row-gap:4px}.team .stepper{justify-self:start}.team .del{justify-self:end}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <h1>АЮ <span>READY</span> КВИЗ</h1>
      <div class="status" id="status"><i class="dot"></i><span id="statusText">Подключение…</span></div>
    </div>
    <div class="modes">
      <button class="mode" id="modeAnswers" aria-pressed="true">Ответы</button>
      <button class="mode" id="modeTeams" aria-pressed="false">Команды</button>
    </div>
  </header>

  <section id="answersView">
    <div class="rounds" id="rounds"></div>
    <h2 id="roundTitle">Тур 1</h2>
    <div class="sheet" id="sheet"></div>
    <div class="all">
      <h2>Все ответы</h2>
      <div class="scroll"><table id="allTable"></table></div>
    </div>
  </section>

  <section id="teamsView" hidden>
    <div class="summary">
      <div><b id="teamCount">0</b>команд</div>
      <div><b id="peopleCount">0</b>человек всего</div>
    </div>
    <div class="sheet" id="teamList"></div>
    <form class="add" id="addForm">
      <input id="newTeam" placeholder="Название новой команды" autocomplete="off">
      <button class="btn" type="submit">Добавить</button>
    </form>
  </section>

  <div class="backup">
    <button type="button" class="ghost" id="exportBtn">Скачать копию</button>
    <button type="button" class="ghost" id="importBtn">Загрузить копию</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <p class="note" id="note">Всё сохраняется автоматически на сервере и в этом браузере. Можно открыть на другом устройстве — данные будут те же.</p>
</div>

<script>
const ROUNDS = 7, Q = 7, LS_KEY = "ayu-quiz-answers-v1";
let answers = emptyAnswers(), teams = [], round = 1, mode = "answers";
let stamp = {answers:0, teams:0}; // время последнего изменения каждой части
const timers = {}, pending = {answers:false, teams:false}, writing = {answers:false, teams:false};

function emptyAnswers(){const o={};for(let r=1;r<=ROUNDS;r++)o[r]=Array(Q).fill("");return o}
function normAnswers(src){const o=emptyAnswers();if(src)for(let r=1;r<=ROUNDS;r++){const a=src[r]||src[String(r)];if(Array.isArray(a))for(let i=0;i<Q;i++)o[r][i]=String(a[i]??"")}return o}
function normTeams(list){return Array.isArray(list)?list.map(t=>({id:String(t.id||uid()),name:String(t.name||""),people:Math.max(0,parseInt(t.people)||0)})):[]}
function uid(){return Math.random().toString(36).slice(2,10)}
const $ = id => document.getElementById(id);

function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify({answers,teams,stamp}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS_KEY)||"null");if(d){answers=normAnswers(d.answers);teams=normTeams(d.teams);if(d.stamp)stamp={answers:+d.stamp.answers||0,teams:+d.stamp.teams||0}}}catch(e){}}

function setStatus(kind,text){$("status").className="status "+kind;$("statusText").textContent=text}
function timeNow(){return new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}

/* ---------- saving (server + copy in this browser) ---------- */
let online=false;
function schedule(which){
  stamp[which]=Date.now();
  saveLocal();
  pending[which]=true;
  setStatus("saving","Сохраняю…");
  clearTimeout(timers[which]);
  timers[which]=setTimeout(()=>flush(which),500);
}
async function flush(which){
  if(writing[which]){timers[which]=setTimeout(()=>flush(which),300);return}
  writing[which]=true; pending[which]=false;
  const body={section:which,updatedAt:stamp[which],data:which==="answers"?answers:teams};
  try{
    const r=await fetch("api/save",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),keepalive:true});
    if(!r.ok)throw new Error(r.status);
    online=true; setStatus("saved","Сохранено "+timeNow());
  }catch(e){
    pending[which]=true; online=false;
    setStatus("error","Нет связи — сохранено в этом браузере, отправлю позже");
    clearTimeout(timers[which]); timers[which]=setTimeout(()=>flush(which),4000);
  }finally{ writing[which]=false; }
}
window.addEventListener("beforeunload",()=>{for(const w of ["answers","teams"])if(pending[w])flush(w)});

async function pull(){
  try{
    const r=await fetch("api/state",{cache:"no-store"}); if(!r.ok)throw 0;
    const s=await r.json(); online=true;
    // ответы
    const sa=s.answers||{updatedAt:0};
    if(!pending.answers&&!writing.answers){
      if(sa.updatedAt>stamp.answers){answers=normAnswers(sa.data);stamp.answers=sa.updatedAt;saveLocal();refreshAnswerInputs()}
      else if(stamp.answers>sa.updatedAt){flush("answers")} // на сервере старее (например, после перезапуска) — отправляем свою копию
    }
    const st=s.teams||{updatedAt:0};
    if(!pending.teams&&!writing.teams){
      if(st.updatedAt>stamp.teams){teams=normTeams(st.data);stamp.teams=st.updatedAt;saveLocal();refreshTeamsFromRemote()}
      else if(stamp.teams>st.updatedAt){flush("teams")}
    }
    if(!pending.answers&&!pending.teams&&!writing.answers&&!writing.teams&&$("statusText").textContent.indexOf("Сохранено")!==0)setStatus("saved","Сохранено");
  }catch(e){ online=false; setStatus("error","Нет связи с сервером — данные сохранены в этом браузере"); }
}

/* ---------- rendering: answers ---------- */
function filled(r){return answers[r].filter(s=>s.trim()).length}
function renderRounds(){
  const box=$("rounds");box.innerHTML="";
  for(let r=1;r<=ROUNDS;r++){
    const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed",r===round);
    b.innerHTML=`Тур ${r}<small>${filled(r)}/${Q}</small>`;
    b.onclick=()=>{round=r;renderAnswers()};box.appendChild(b);
  }
}
function renderSheet(){
  $("roundTitle").textContent="Тур "+round;
  const sheet=$("sheet");sheet.innerHTML="";
  for(let i=0;i<Q;i++){
    const row=document.createElement("label");row.className="row";
    row.innerHTML=`<span class="num">${i+1}</span>`;
    const inp=document.createElement("input");inp.id=`a-${round}-${i}`;inp.placeholder="Ответ на вопрос "+(i+1);
    inp.value=answers[round][i];inp.autocomplete="off";
    inp.oninput=()=>{answers[round][i]=inp.value;renderRounds();renderAll();schedule("answers")};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const n=$(`a-${round}-${i+1}`);if(n)n.focus();else if(round<ROUNDS){round++;renderAnswers();$(`a-${round}-0`).focus()}}};
    row.appendChild(inp);sheet.appendChild(row);
  }
}
function renderAll(){
  const t=$("allTable");let h="<tr><th>№</th>";
  for(let r=1;r<=ROUNDS;r++)h+=`<th>Тур ${r}</th>`;h+="</tr>";
  for(let i=0;i<Q;i++){h+=`<tr><td>${i+1}</td>`;for(let r=1;r<=ROUNDS;r++)h+=`<td>${esc(answers[r][i])}</td>`;h+="</tr>"}
  t.innerHTML=h;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function renderAnswers(){renderRounds();renderSheet();renderAll()}
function refreshAnswerInputs(){ // after remote change: keep the field being typed in
  for(let i=0;i<Q;i++){const el=$(`a-${round}-${i}`);if(el&&el!==document.activeElement)el.value=answers[round][i]}
  renderRounds();renderAll();
}

/* ---------- rendering: teams ---------- */
function renderTeams(){
  $("teamCount").textContent=teams.length;
  $("peopleCount").textContent=teams.reduce((s,t)=>s+t.people,0);
  const list=$("teamList");list.innerHTML="";
  if(!teams.length){list.innerHTML='<div class="empty">Команд пока нет. Впишите название ниже и нажмите «Добавить».</div>';return}
  teams.forEach((t,k)=>{
    const row=document.createElement("div");row.className="team";
    row.innerHTML=`<span class="idx">${k+1}</span>`;
    const name=document.createElement("textarea");name.className="name";name.rows=1;name.id="tn-"+t.id;name.value=t.name;name.placeholder="Название";
    const fit=()=>{name.style.height="auto";name.style.height=name.scrollHeight+"px"};
    name.oninput=()=>{name.value=name.value.replace(/\n/g," ");t.name=name.value;fit();schedule("teams")};
    name.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();name.blur()}};
    requestAnimationFrame(fit);
    const st=document.createElement("div");st.className="stepper";
    const minus=document.createElement("button");minus.type="button";minus.textContent="−";minus.setAttribute("aria-label","Меньше");
    const num=document.createElement("input");num.type="number";num.min="0";num.id="tp-"+t.id;num.value=t.people;num.setAttribute("aria-label","Человек в команде");
    const plus=document.createElement("button");plus.type="button";plus.textContent="+";plus.setAttribute("aria-label","Больше");
    const setP=v=>{t.people=Math.max(0,v|0);num.value=t.people;$("peopleCount").textContent=teams.reduce((s,x)=>s+x.people,0);schedule("teams")};
    minus.onclick=()=>setP(t.people-1);plus.onclick=()=>setP(t.people+1);
    num.oninput=()=>setP(parseInt(num.value)||0);
    st.append(minus,num,plus);
    const del=document.createElement("button");del.type="button";del.className="del";del.textContent="Удалить";
    let armed=null;
    del.onclick=()=>{
      if(del.classList.contains("confirm")){teams=teams.filter(x=>x.id!==t.id);renderTeams();schedule("teams");return}
      del.classList.add("confirm");del.textContent="Точно удалить?";
      clearTimeout(armed);armed=setTimeout(()=>{del.classList.remove("confirm");del.textContent="Удалить"},3000);
    };
    row.append(name,st,del);list.appendChild(row);
  });
}
function refreshTeamsFromRemote(){
  const a=document.activeElement;
  if(a&&(a.id||"").match(/^t[np]-/)&&document.getElementById(a.id)){ // keep typing, update counts only
    $("teamCount").textContent=teams.length;$("peopleCount").textContent=teams.reduce((s,t)=>s+t.people,0);return}
  renderTeams();
}
$("addForm").addEventListener("submit",e=>{
  e.preventDefault();const v=$("newTeam").value.trim();if(!v)return;
  teams.push({id:uid(),name:v,people:0});$("newTeam").value="";renderTeams();schedule("teams");$("newTeam").focus();
});

/* ---------- modes ---------- */
function setMode(m){mode=m;$("modeAnswers").setAttribute("aria-pressed",m==="answers");$("modeTeams").setAttribute("aria-pressed",m==="teams");
  $("answersView").hidden=m!=="answers";$("teamsView").hidden=m!=="teams";try{localStorage.setItem("ayu-quiz-mode",m)}catch(e){}}
$("modeAnswers").onclick=()=>setMode("answers");$("modeTeams").onclick=()=>setMode("teams");

/* ---------- backup file ---------- */
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({answers,teams,stamp},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="kviz-kopiya-"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async()=>{
  const f=$("importFile").files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());answers=normAnswers(d.answers);teams=normTeams(d.teams);
    renderAnswers();renderTeams();schedule("answers");schedule("teams");}
  catch(e){setStatus("error","Файл не подошёл — нужен файл копии квиза (.json)")}
  $("importFile").value="";
};

/* ---------- boot ---------- */
loadLocal();
try{const m=localStorage.getItem("ayu-quiz-mode");if(m==="teams")setMode("teams")}catch(e){}
renderAnswers();renderTeams();
setStatus("saving","Подключение…");
pull(); setInterval(pull,3000);
</script>
</body>
</html>
